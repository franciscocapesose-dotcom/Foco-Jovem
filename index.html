.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 var p=pct(),C=2*Math.PI*48,pend=S.tasks.filter(function(t){return!t.done}),done=S.tasks.length-pend.length;
 var up=pend.slice().sort(function(a,b){return a.due<b.due?-1:1}).slice(0,4);
 var m=monday(today()),cnt=[0,0,0,0,0,0,0];
 S.tasks.forEach(function(t){if(t.done&&t.doneAt){for(var i=0;i<7;i++)if(t.doneAt===key(addDays(m,i)))cnt[i]++}});
 var mx=Math.max.apply(null,cnt.concat([1])),ti=(new Date().getDay()+6)%7;
 var best=cnt.indexOf(Math.max.apply(null,cnt)),tk=key(today());
 var hd=S.habits.filter(function(h){return h.days[tk]}).length;
 return '<h1>Olá, '+esc(S.name)+'</h1><p class="sub">Veja como está o seu foco hoje.</p>'+
 '<div class="grid stats"><div class="card stat s1"><b>'+p+'%</b><span>Progresso geral</span></div><div class="card stat s2"><b>'+done+'</b><span>Tarefas concluídas</span></div><div class="card stat s3"><b>'+pend.length+'</b><span>Tarefas pendentes</span></div><div class="card stat s4"><b>'+(Math.max.apply(null,cnt)?DN[best]:"–")+'</b><span>Dia mais produtivo</span></div></div>'+
 '<div class="grid two"><div class="card"><h2>Próximas entregas</h2>'+(up.length?up.map(function(t){return taskRow(t)}).join(""):'<div class="empty">Nada pendente. Aproveite para criar uma nova meta.</div>')+'</div>'+
 '<div class="card"><h2>Seu progresso</h2><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="60" cy="60" r="48" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*p/100)+' '+C+'" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">'+p+'%</text></svg><div><b>'+done+' de '+S.tasks.length+'</b> tarefas feitas<br><span class="m" style="color:var(--mute)">'+hd+' de '+S.habits.length+' hábitos hoje</span></div></div></div></div>'+
 '<div class="grid two"><div class="card"><h2>Tarefas concluídas na semana</h2><div class="chart">'+cnt.map(function(c,i){return '<div class="'+(i===ti?'today':'')+'"><b>'+c+'</b><i style="height:'+(c/mx*100*0.75)+'%"></i>'+DN[i]+'</div>'}).join("")+'</div></div>'+
 '<div class="card"><h2>Metas em andamento</h2>'+(S.goals.length?S.goals.slice(0,3).map(function(g){return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:8px"><span class="t">'+esc(g.t)+'</span><b>'+g.p+'%</b></div><div class="bar"><i style="width:'+g.p+'%"></i></div></div>'}).join(""):'<div class="empty">Defina sua primeira meta na aba Metas.</div>')+'</div></div>'
}
function vTasks(){
 var L=S.tasks.filter(function(t){return filter==="todas"||(filter==="pendentes"&&!t.done)||(filter==="concluidas"&&t.done)});
 L.sort(function(a,b){return a.done-b.done||(a.due<b.due?-1:1)});
 var f=[["todas","Todas"],["pendentes","Pendentes"],["concluidas","Concluídas"]];
 return '<div class="head"><div><h1>Tarefas</h1><p class="sub">Organize o que precisa ser entregue.</p></div></div>'+
 '<div class="card"><div class="quick"><input type="text" id="nt" placeholder="Nova tarefa, ex.: Exercícios de Física" maxlength="120" aria-label="Nova tarefa"><input type="text" id="ns" placeholder="Matéria" maxlength="30" style="width:130px" aria-label="Matéria"><input type="date" id="nd" value="'+key(addDays(today(),1))+'" aria-label="Data de entrega"><select id="np" aria-label="Prioridade"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select><button class="btn" data-act="ta">Adicionar tarefa</button></div>'+
 '<div class="filters">'+f.map(function(x){return '<button data-act="tf" data-id="'+x[0]+'" class="'+(filter===x[0]?'on':'')+'">'+x[1]+'</button>'}).join("")+'</div>'+
 (L.length?L.map(function(t){return taskRow(t,true)}).join(""):'<div class="empty">Nenhuma tarefa aqui. Adicione uma acima.</div>')+'</div>'
}
function vWeek(){
 var m=addDays(monday(today()),weekOff*7),tk=key(today()),h="";
 for(var i=0;i<7;i++){var d=addDays(m,i),k=key(d);
  var its=S.plan.filter(function(x){return x.date===k}).sort(function(a,b){return(a.time||"")<(b.time||"")?-1:1});
  h+='<div class="day'+(k===tk?' today':'')+'"><h3>'+DN[i]+'<small>'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</small></h3>'+
  its.map(function(x){return '<div class="it'+(x.done?' done':'')+'">'+chk(x.done,"pt",x.id)+'<div class="grow">'+esc(x.t)+(x.time?'<small>'+x.time+'</small>':'')+'</div><button class="x" data-act="pd" data-id="'+x.id+'" aria-label="Excluir">×</button></div>'}).join("")+
  '<button class="ghost" style="margin-top:auto" data-act="pa" data-id="'+k+'">+ Adicionar</button></div>'}
 var e=addDays(m,6);
 return '<div class="head"><div><h1>Planejador semanal</h1><p class="sub">'+pad(m.getDate())+'/'+pad(m.getMonth()+1)+' a '+pad(e.getDate())+'/'+pad(e.getMonth()+1)+'</p></div><div><button class="ghost" data-act="wp">‹ Anterior</button> <button class="ghost" data-act="w0">Hoje</button> <button class="ghost" data-act="wn">Próxima ›</button></div></div><div class="week">'+h+'</div>'
}
function vHabits(){
 var days=[];for(var i=6;i>=0;i--)days.push(addDays(today(),-i));
 var tk=key(today());
 return '<div class="head"><div><h1>Hábitos</h1><p class="sub">Pequenas repetições constroem grandes resultados.</p></div><button class="btn" data-act="ha">Novo hábito</button></div><div class="card">'+
 '<div class="hgrid" style="margin-bottom:8px"><span></span>'+days.map(function(d){return '<span class="d'+(key(d)===tk?' today':'')+'">'+DN[(d.getDay()+6)%7].slice(0,3)+'<br>'+d.getDate()+'</span>'}).join("")+'<span></span></div>'+
 (S.habits.length?S.habits.map(function(h){var s=streak(h);return '<div class="row"><div class="hgrid" style="flex:1"><div><span class="t">'+esc(h.name)+'</span> <button class="x" data-act="hd" data-id="'+h.id+'" aria-label="Excluir hábito">×</button></div>'+days.map(function(d){var k=key(d);return chk(!!h.days[k],"hh",h.id,' data-d="'+k+'"')}).join("")+'<span class="streak">'+(s?s+' dia'+(s>1?'s':''):'–')+'</span></div></div>'}).join(""):'<div class="empty">Crie um hábito para começar a acompanhar sua rotina.</div>')+'</div>'
}
function vGoals(){
 return '<div class="head"><div><h1>Metas pessoais</h1><p class="sub">Defina onde quer chegar e acompanhe cada passo.</p></div><button class="btn" data-act="ga">Nova meta</button></div><div class="card">'+
 (S.goals.length?S.goals.map(function(g){var d=g.date?diff(g.date):null;return '<div class="goal"><div class="top"><div><div class="t" style="font-weight:700">'+esc(g.t)+'</div><div class="m" style="color:var(--mute);font-size:13px">'+(g.date?'Prazo: '+fmt(g.date)+(d<0?' (vencido)':' · faltam '+d+' dias'):'Sem prazo')+'</div></div><div class="act"><button class="ghost" data-act="gm" data-id="'+g.id+'">−10%</button><button class="ghost" data-act="gp" data-id="'+g.id+'">+10%</button><button class="ghost" data-act="ge" data-id="'+g.id+'">Editar</button><button class="ghost del" data-act="gd" data-id="'+g.id+'">Excluir</button></div></div><div style="display:flex;align-items:center;gap:12px"><div class="bar" style="flex:1"><i style="width:'+g.p+'%"></i></div><b>'+g.p+'%</b></div></div>'}).join(""):'<div class="empty">Nenhuma meta ainda. Crie a primeira.</div>')+'</div>'
}
function render(){
 document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+ICON[t[2]]+t[1]+'</button>'}).join("");
 document.getElementById("who").textContent="Foco de "+S.name;
 var v={dash:vDash,tasks:vTasks,week:vWeek,habits:vHabits,goals:vGoals}[tab];
 document.getElementById("view").innerHTML=v();
}
function commit(){save();render()}

function form(title,fields,ok){
 var o=document.createElement("div");o.className="modal";
 o.innerHTML='<form><h2 style="margin:0">'+title+'</h2>'+fields.map(function(f){
  var inp=f.opts?'<select name="'+f.k+'">'+f.opts.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===f.v?' selected':'')+'>'+x[1]+'</option>'}).join("")+'</select>':'<input name="'+f.k+'" type="'+(f.type||"text")+'" value="'+esc(f.v||"")+'"'+(f.req?' required':'')+' maxlength="120"'+(f.type==="number"?' min="0" max="100"':'')+'>';
  return '<label>'+f.l+inp+'</label>'}).join("")+'<div class="acts"><button type="button" class="ghost" data-x>Cancelar</button><button class="btn">Salvar</button></div></form>';
 document.body.appendChild(o);
 var fm=o.querySelector("form");fm.elements[0].focus();
 function close(){o.remove()}
 o.addEventListener("click",function(e){if(e.target===o||e.target.hasAttribute("data-x"))close()});
 fm.addEventListener("submit",function(e){e.preventDefault();var r={};fields.forEach(function(f){r[f.k]=fm.elements[f.k].value.trim()});ok(r);close()});
}
function by(a,id){return S[a].filter(function(x){return x.id===id})[0]}
var PRI=[["alta","Alta"],["media","Média"],["baixa","Baixa"]];

document.addEventListener("click",function(e){
 var tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
 var b=e.target.closest("[data-act]");if(!b)return;
 var a=b.dataset.act,id=b.dataset.id,x;
 if(a==="tt"){x=by("tasks",id);x.done=!x.done;x.doneAt=x.done?key(today()):null;commit();if(x.done)toast("Tarefa concluída")}
 else if(a==="ta"){var t=document.getElementById("nt").value.trim();if(!t){toast("Digite o nome da tarefa");document.getElementById("nt").focus();return}
  S.tasks.push({id:uid(),t:t,subject:document.getElementById("ns").value.trim(),due:document.getElementById("nd").value||key(today()),pri:document.getElementById("np").value,done:false});commit();toast("Tarefa adicionada")}
 else if(a==="td"){if(confirm("Excluir esta tarefa?")){S.tasks=S.tasks.filter(function(t){return t.id!==id});commit();toast("Tarefa excluída")}}
 else if(a==="te"){x=by("tasks",id);form("Editar tarefa",[{k:"t",l:"Tarefa",v:x.t,req:1},{k:"subject",l:"Matéria",v:x.subject},{k:"due",l:"Entrega",type:"date",v:x.due},{k:"pri",l:"Prioridade",v:x.pri,opts:PRI}],function(r){if(!r.t)return;x.t=r.t;x.subject=r.subject;x.due=r.due||x.due;x.pri=r.pri;commit();toast("Tarefa atualizada")})}
 else if(a==="tf"){filter=id;render()}
 else if(a==="wp"){weekOff--;render()}else if(a==="wn"){weekOff++;render()}else if(a==="w0"){weekOff=0;render()}
 else if(a==="pa"){form("Novo compromisso",[{k:"t",l:"O que vai fazer?",req:1},{k:"time",l:"Horário",type:"time",v:"16:00"}],function(r){if(!r.t)return;S.plan.push({id:uid(),date:id,t:r.t,time:r.time,done:false});commit();toast("Compromisso adicionado")})}
 else if(a==="pt"){x=by("plan",id);x.done=!x.done;commit()}
 else if(a==="pd"){S.plan=S.plan.filter(function(p){return p.id!==id});commit();toast("Compromisso excluído")}
 else if(a==="ha"){form("Novo hábito",[{k:"name",l:"Nome do hábito",req:1}],function(r){if(!r.name)return;S.habits.push({id:uid(),name:r.name,days:{}});commit();toast("Hábito criado")})}
 else if(a==="hh"){x=by("habits",id);var d=b.dataset.d;if(x.days[d])delete x.days[d];else x.days[d]=true;commit()}
 else if(a==="hd"){if(confirm("Excluir este hábito?")){S.habits=S.habits.filter(function(h){return h.id!==id});commit();toast("Hábito excluído")}}
 else if(a==="ga"){form("Nova meta",[{k:"t",l:"Qual é a sua meta?",req:1},{k:"date",l:"Prazo",type:"date",v:key(addDays(today(),30))},{k:"p",l:"Progresso atual (%)",type:"number",v:"0"}],function(r){if(!r.t)return;S.goals.push({id:uid(),t:r.t,date:r.date,p:Math.min(100,Math.max(0,parseInt(r.p)||0))});commit();toast("Meta criada")})}
 else if(a==="ge"){x=by("goals",id);form("Editar meta",[{k:"t",l:"Meta",v:x.t,req:1},{k:"date",l:"Prazo",type:"date",v:x.date},{k:"p",l:"Progresso (%)",type:"number",v:String(x.p)}],function(r){if(!r.t)return;x.t=r.t;x.date=r.date;x.p=Math.min(100,Math.max(0,parseInt(r.p)||0));commit();toast("Meta atualizada")})}
 else if(a==="gp"||a==="gm"){x=by("goals",id);x.p=Math.min(100,Math.max(0,x.p+(a==="gp"?10:-10)));commit();if(x.p===100)toast("Meta alcançada! Parabéns")}
 else if(a==="gd"){if(confirm("Excluir esta meta?")){S.goals=S.goals.filter(function(g){return g.id!==id});commit();toast("Meta excluída")}}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="nt"){var b=document.querySelector('[data-act="ta"]');if(b)b.click()}});
document.getElementById("logout").onclick=async function(){clearTimeout(timer);await flush();LOADED=false;USER=null;S=null;try{await sb.auth.signOut()}catch(e){}showAuth("login")};
document.getElementById("theme").onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+".theme",r.dataset.theme)}catch(e){}};
try{var th=localStorage.getItem(KEY+".theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
if(!CONFIGURED){showAuth("login");document.querySelector("#auth .err").textContent="Site ainda não configurado: preencha SUPABASE_URL e SUPABASE_KEY no código."}
else sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)enter(s.user);else showAuth("login")});
})();
</script>
